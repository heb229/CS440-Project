<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Movie Critiques</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Movie Catalog</a>
        <div class="navbar-nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link active" href="movie_critiques.html">Critiques</a>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="container py-4">
      <h1 class="mb-4">All Movie Critiques</h1>

      <ul id="critiques" class="list-group"></ul>
    </main>

    <!-- Bootstrap JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fetch critiques -->
    <script>
      fetch("http://localhost:3000/critiques")
        .then((res) => res.json())
        .then((critiques) => {
          const list = document.getElementById("critiques");

          // If there are no critiques, display a message indicating that no critiques are available. 
          // Otherwise, iterate through the list of critiques and create a list item for each critique, 
          // displaying the title, author, creation date, associated movie (with a link to the movie page), 
          // and the content of the critique.
          if (!critiques || critiques.length === 0) {
            list.innerHTML =
              '<li class="list-group-item">No critiques available.</li>';
            return;
          }

          critiques.forEach((c) => {
            const li = document.createElement("li");
            li.className = "list-group-item";

            li.innerHTML = `
              <h5 class="mb-1">${c.title}</h5>
              <small class="text-muted">
                by ${c.author} • ${new Date(c.created_at).toLocaleDateString()}
              </small>

              <div class="mt-2">
                Movie:
                <a href="./movie.html?id=${c.movie_id}" onclick="localStorage.setItem('selectedMovieId', '${c.movie_id}')">
                  ${c.movie_title || "Movie #" + c.movie_id}
                </a>
              </div>

              <p class="mt-2 mb-0">${c.content}</p>
            `;

            list.appendChild(li);
          });
        })
        // If any error occurs while fetching the critiques, log the error to the console and display an error message in the critiques list.
        .catch((err) => {
          console.error("Error fetching critiques:", err);
          document.getElementById("critiques").innerHTML =
            '<li class="list-group-item text-danger">Error loading critiques.</li>';
        });
    </script>
  </body>
</html>
