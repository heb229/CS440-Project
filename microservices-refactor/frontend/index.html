<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Movie Catalog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Optional custom styles -->
    <style>
      #genre-filters label {
        margin-right: 12px;
      }
    </style>
  </head>

  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Movie Catalog</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="index.html">Home</a>
          <a class="nav-link" href="movie_critiques.html">Critiques</a>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="container py-4">
      <h1 class="mb-4">Movies</h1>

      <!-- Search -->
      <div class="mb-3">
        <input
          id="search"
          class="form-control"
          placeholder="Search title…"
        />
      </div>

      <!-- AND / OR toggle -->
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="genre-mode"
            value="or"
            checked
          />
          <label class="form-check-label">Any (OR)</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="genre-mode"
            value="and"
          />
          <label class="form-check-label">All (AND)</label>
        </div>
      </div>

      <!-- Genre filters -->
      <div id="genre-filters" class="mb-3">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Action" />
          <label class="form-check-label">Action</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Drama" />
          <label class="form-check-label">Drama</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Crime" />
          <label class="form-check-label">Crime</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="War" />
          <label class="form-check-label">War</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Comedy" />
          <label class="form-check-label">Comedy</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Sci-Fi" />
          <label class="form-check-label">Sci-Fi</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" value="Biography" />
          <label class="form-check-label">Biography</label>
        </div>
      </div>

      <!-- Sorting -->
      <div class="row g-2 align-items-center mb-4">
        <div class="col-auto">
          <select id="sort" class="form-select">
            <option value="title">Title A–Z</option>
            <option value="year">Release Year</option>
            <option value="rating">Rating</option>
          </select>
        </div>
        <div class="col-auto">
          <button id="toggleOrder" class="btn btn-secondary">
            Asc / Desc
          </button>
        </div>
      </div>

      <!-- Movie list -->
      <ul id="movies" class="list-group"></ul>
    </main>

    <!-- Bootstrap JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
