<h1 id="title"></h1>
<p id="synopsis"></p>
<ul id="cast"></ul>

<script>
  const id = new URLSearchParams(location.search).get('id')

  fetch(`/api/movie?id=${id}`)
    .then(res => res.json())
    .then(movie => {
      document.getElementById('title').textContent = movie.title
      document.getElementById('synopsis').textContent = movie.synopsis

      movie.cast.forEach(c => {
        const li = document.createElement('li')
        li.innerHTML = `<a href="person.html?id=${c.people.id}">${c.people.name}</a>`
        document.getElementById('cast').appendChild(li)
      })
    })
</script>
