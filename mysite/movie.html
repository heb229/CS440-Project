<h1 id="title"></h1>
<p id="director"></p>
<p id="synopsis"></p>

<h3>Cast</h3>
<ul id="cast"></ul>

<h3>Critiques</h3>
<ul id="critiques"></ul> <!-- NEW -->

<script>
  const id = new URLSearchParams(location.search).get('id')

  // Fetch movie info
  fetch(`/api/movie?id=${id}`)
    .then(res => res.json())
    .then(movie => {
      document.getElementById('title').textContent = movie.title
      document.getElementById('synopsis').textContent = movie.synopsis

      if (movie.director) {
        document.getElementById('director').innerHTML =
          `Director: <a href="person.html?id=${movie.director.id}">${movie.director.name}</a>`
      }

      movie.cast.forEach(person => {
        const li = document.createElement('li')
        li.innerHTML = `<a href="person.html?id=${person.id}">${person.name}</a>`
        document.getElementById('cast').appendChild(li)
      })
    })

  // Fetch critiques
  fetch(`/api/critiques?movie_id=${id}`)
    .then(res => res.json())
    .then(critiques => {
      const list = document.getElementById('critiques')
      if (!critiques || critiques.length === 0) {
        list.innerHTML = '<li>No critiques available.</li>'
        return
      }

      critiques.forEach(c => {
        const li = document.createElement('li')
        li.innerHTML = `
          <strong>${c.title}</strong> by ${c.author} (${new Date(c.created_at).toLocaleDateString()})
          <p>${c.content}</p>
        `
        list.appendChild(li)
      })
    })
</script>
