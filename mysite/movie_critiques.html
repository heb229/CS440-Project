<!DOCTYPE html>
<html>
<head>
  <title>Movie Critiques</title>
</head>
<body>
  <h1>All Movie Critiques</h1>

  <ul id="critiques"></ul>

  <script>
    // Fetch all critiques
    fetch('/api/critiques')
      .then(res => res.json())
      .then(critiques => {
        const list = document.getElementById('critiques')
        if (!critiques || critiques.length === 0) {
          list.innerHTML = '<li>No critiques available.</li>'
          return
        }

        critiques.forEach(c => {
          const li = document.createElement('li')
          li.innerHTML = `
            <strong>${c.title}</strong> by ${c.author} (${new Date(c.created_at).toLocaleDateString()})<br>
            Movie: <a href="movie.html?id=${c.movie_id}">${c.movie_title}</a>
            <p>${c.content}</p>
          `
          list.appendChild(li)
        })
      })
      .catch(err => {
        console.error('Error fetching critiques:', err)
        document.getElementById('critiques').innerHTML = '<li>Error loading critiques.</li>'
      })
  </script>
</body>
</html>
