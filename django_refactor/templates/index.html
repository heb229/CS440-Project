<!doctype html>
<html>
  <head>
    <title>Movie Catalog</title>
    <style>
      body {
        font-family: sans-serif;
      }
      #genre-filters label {
        margin-right: 10px;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Movies</h1>

    <!-- Search box -->
    <input id="search" placeholder="Search title…" />

    <!-- AND / OR toggle -->
    <div>
      <label>
        <input type="radio" name="genre-mode" value="or" checked /> Any (OR)
      </label>
      <label>
        <input type="radio" name="genre-mode" value="and" /> All (AND)
      </label>
    </div>

    <!-- Multi-genre filters -->
    <div id="genre-filters">
      <label><input type="checkbox" value="Action" /> Action</label>
      <label><input type="checkbox" value="Drama" /> Drama</label>
      <label><input type="checkbox" value="Crime" /> Crime</label>
      <label><input type="checkbox" value="War" /> War</label>
      <label><input type="checkbox" value="Comedy" /> Comedy</label>
      <label><input type="checkbox" value="Sci-Fi" /> Sci-Fi</label>
      <label><input type="checkbox" value="Biography" /> Biography</label>
    </div>

    <!-- Sorting -->
    <select id="sort">
      <option value="title">Title A–Z</option>
      <option value="year">Release Year</option>
      <option value="rating">Rating</option>
    </select>

    <!-- Toggle ascending/descending -->
    <button id="toggleOrder">Asc/Desc</button>

    <!-- Movie list -->
    <ul id="movies"></ul>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
