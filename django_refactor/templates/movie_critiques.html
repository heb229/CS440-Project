<!doctype html>
<html>
  <head>
    <title>Movie Critiques</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>All Movie Critiques</h1>

    <ul id="critiques"></ul>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script>
      // Fetch all critiques
      fetch("/api/critiques")
        .then((res) => res.json())
        .then((critiques) => {
          const list = document.getElementById("critiques");
          if (!critiques || critiques.length === 0) {
            list.innerHTML = "<li>No critiques available.</li>";
            return;
          }

          critiques.forEach((c) => {
            const li = document.createElement("li");
            li.innerHTML = `
            <strong>${c.title}</strong> by ${c.author} (${new Date(c.created_at).toLocaleDateString()})<br>
            Movie: <a href="movie.html?id=${c.movie_id}">${c.movie_title}</a>
            <p>${c.content}</p>
          `;
            list.appendChild(li);
          });
        })
        .catch((err) => {
          console.error("Error fetching critiques:", err);
          document.getElementById("critiques").innerHTML =
            "<li>Error loading critiques.</li>";
        });
    </script>
  </body>
</html>
